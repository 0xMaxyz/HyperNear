[package]
name = "leash"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# testnet-only admin signing (sign_raw, admin_sign_hl). Never enable for mainnet.
spike = []

[dependencies]
near-sdk = { version = "5.30", features = ["unstable"] }  # unstable: env::ecrecover
hex = "0.4"
shade-attestation = { path = "vendor/shade-attestation" }  # vendored: crates.io 0.2.0 pins serde_with =3.17 (near-sdk 5.30 needs ^3.20)

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing", "unstable"] }
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
