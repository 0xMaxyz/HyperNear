packages:
  - 'packages/*'
  - 'agent'
  - 'validation'
  - 'web'
overrides:
  # viem >= 2.57 rejects the "HyperliquidTransaction:*" EIP-712 struct names; PerpX pinned 2.54.3
  viem: 2.54.3
allowBuilds:
  esbuild: true
  # Privy's optional native add-ons; the pure-JS fallbacks are fine in the browser build
  '@reown/appkit': false
  bufferutil: false
  keccak: false
  utf-8-validate: false
